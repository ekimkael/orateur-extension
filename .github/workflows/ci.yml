name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `postinstall` lance déjà `wxt prepare`.
      - run: npm ci
      - run: npm run compile
      - run: npm test

      # Les mêmes paquets que ceux d'une release, pour que ce qui est testé en
      # staging soit exactement ce qui partira aux stores.
      - run: npm run zip
      - run: npm run zip:firefox

      - uses: actions/upload-artifact@v4
        with:
          name: orateur-${{ github.sha }}
          path: .output/*.zip
          # 3 zips de ~26 Mo par run : la rétention de 90 jours par défaut
          # remplirait le quota du dépôt pour rien.
          retention-days: 7
