name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Vérifier l'authentification des stores sans rien soumettre"
        type: boolean
        default: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # créer la GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # merge-base a besoin de l'historique

      # Les deux ratés classiques d'une release sur tag : le tag posé depuis une
      # branche de feature, et le tag posé sans avoir bumpé package.json. Les
      # stores refusent une version déjà soumise, donc mieux vaut échouer ici.
      - name: Le tag doit être sur main et correspondre à package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run compile
      - run: npm test
      - name: Vérifier la configuration PostHog de production
        env:
          WXT_POSTHOG_KEY: ${{ vars.WXT_POSTHOG_KEY }}
          WXT_POSTHOG_REGION: ${{ vars.WXT_POSTHOG_REGION }}
        run: |
          node --input-type=module -e '
            const { WXT_POSTHOG_KEY: key, WXT_POSTHOG_REGION: region } = process.env
            if (!/^phc_[A-Za-z0-9_-]+$/.test(key ?? "") || /replace|your_project/i.test(key) || !["eu", "us"].includes(region)) {
              console.error("Configurer les variables Actions WXT_POSTHOG_KEY et WXT_POSTHOG_REGION avant publication.")
              process.exit(1)
            }
          '
      - run: npm run zip
        env:
          WXT_POSTHOG_KEY: ${{ vars.WXT_POSTHOG_KEY }}
          WXT_POSTHOG_REGION: ${{ vars.WXT_POSTHOG_REGION }}
      - run: npm run zip:firefox
        env:
          WXT_POSTHOG_KEY: ${{ vars.WXT_POSTHOG_KEY }}
          WXT_POSTHOG_REGION: ${{ vars.WXT_POSTHOG_REGION }}
      - run: npm run test:packages
      # Le runner crée le cache du projet ; root n'installe que les dépendances système.
      - run: npx puppeteer browsers install chrome
      - run: sudo env "PATH=$PATH" "PUPPETEER_CACHE_DIR=$PWD/.cache/puppeteer" npx puppeteer browsers install chrome --install-deps
      - run: npx puppeteer browsers install firefox
      - run: npm run test:e2e
      - run: npm run test:e2e:firefox

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-tests-${{ github.sha }}
          path: .output/test-results/
          include-hidden-files: true
          retention-days: 7

      - name: Soumettre aux stores dont les secrets sont configurés
        run: |
          version=$(node -p "require('./package.json').version")
          args=()
          [[ -n "$CHROME_EXTENSION_ID" ]] && args+=(--chrome-zip ".output/orateur-extension-$version-chrome.zip")
          [[ -n "$FIREFOX_EXTENSION_ID" ]] && args+=(--firefox-zip ".output/orateur-extension-$version-firefox.zip" --firefox-sources-zip ".output/orateur-extension-$version-sources.zip")
          # Edge réutilise le zip Chrome : le MV3 passe tel quel.
          [[ -n "$EDGE_PRODUCT_ID" ]] && args+=(--edge-zip ".output/orateur-extension-$version-chrome.zip")
          if [[ ${#args[@]} -eq 0 ]]; then
            echo "Aucun secret de store configuré, rien à soumettre." >&2
            exit 1
          fi
          # Aucun rebuild après les tests : ce sont exactement les ZIP vérifiés.
          (cd .output && sha256sum --check --strict test-results/packages.sha256)
          npx wxt submit ${{ inputs.dry_run && '--dry-run' || '' }} "${args[@]}"
        env:
          # L'API v1.1 (client id / secret / refresh token) est dépréciée dans
          # publish-browser-extension 6 ; v2 passe par un compte de service.
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}

      # `gh` est préinstallé sur les runners : pas d'action tierce à auditer.
      - name: Publier la release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          (cd .output && sha256sum --check --strict test-results/packages.sha256)
          gh release create "$GITHUB_REF_NAME" ".output/orateur-extension-$version-chrome.zip" ".output/orateur-extension-$version-firefox.zip" ".output/orateur-extension-$version-sources.zip" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
