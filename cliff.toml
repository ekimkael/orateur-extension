# git-cliff drafts a release section from Conventional Commits:
#   git cliff --unreleased --tag vX.Y.Z --strip header
# The draft is then rewritten by hand; this file never regenerates CHANGELOG.md.

[changelog]
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^security", group = "Security" },
  { message = "^revert", group = "Removed" },
  { message = "^(refactor|perf|docs)", group = "Changed" },
  { message = "^chore\\(deps", group = "Changed" },
  { message = "^(chore|test|ci|build)", skip = true },
  { message = ".*", group = "Changed" },
]
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
